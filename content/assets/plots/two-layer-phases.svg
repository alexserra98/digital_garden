<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
  <title id="title">Learning phases in a two-layer teacher-student network</title>
  <desc id="desc">Generalization error exhibits an initial drop, a symmetric plateau, specialization, and final convergence. Overlap matrices become diagonal after specialization.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfe}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.axis{stroke:#64748b;stroke-width:1.4}.grid{stroke:#e2e8f0;stroke-width:1}.head{font:700 20px system-ui,sans-serif;fill:#172033}.label{font:15px system-ui,sans-serif;fill:#334155}.small{font:13px system-ui,sans-serif;fill:#64748b}.tag{font:700 14px system-ui,sans-serif}.curve{fill:none;stroke:#1d4ed8;stroke-width:4}.phase{stroke-width:2;stroke-dasharray:6 5}.cell{stroke:#fff;stroke-width:3}.brace{fill:none;stroke:#64748b;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1080" height="450"/>
  <text class="head" x="40" y="38">Two-layer teacher-student dynamics</text>
  <text class="small" x="40" y="64">Macroscopic order parameters Q and R expose symmetry breaking that raw weights hide.</text>

  <g transform="translate(40 92)">
    <rect class="panel" width="620" height="310" rx="6"/>
    <text class="tag" x="18" y="29" fill="#1d4ed8">GENERALIZATION ERROR</text>
    <line class="axis" x1="58" y1="260" x2="590" y2="260"/><line class="axis" x1="58" y1="65" x2="58" y2="260"/>
    <line class="grid" x1="58" y1="210" x2="590" y2="210"/><line class="grid" x1="58" y1="160" x2="590" y2="160"/><line class="grid" x1="58" y1="110" x2="590" y2="110"/>
    <path class="curve" d="M60 82 C105 106 126 142 170 158 C225 176 302 174 362 175 C390 175 405 176 423 187 C447 204 453 229 486 240 C517 250 553 252 588 253"/>
    <line class="phase" x1="168" y1="65" x2="168" y2="260" stroke="#087e8b"/>
    <line class="phase" x1="419" y1="65" x2="419" y2="260" stroke="#c2413b"/>
    <text class="small" x="18" y="67">εgen</text><text class="small" x="579" y="283">α</text>
    <text class="small" x="80" y="286" fill="#087e8b">alignment</text>
    <text class="small" x="237" y="286" fill="#64748b">symmetric plateau</text>
    <text class="small" x="437" y="286" fill="#c2413b">specialization</text>
    <text class="small" x="510" y="238">convergence</text>
  </g>

  <g transform="translate(700 92)">
    <rect class="panel" width="340" height="310" rx="6"/>
    <text class="tag" x="18" y="29" fill="#087e8b">TEACHER OVERLAP R</text>
    <text class="small" x="24" y="59">before specialization</text>
    <g transform="translate(24 72)">
      <rect class="cell" width="48" height="48" fill="#91d5d8"/><rect class="cell" x="48" width="48" height="48" fill="#91d5d8"/><rect class="cell" x="96" width="48" height="48" fill="#91d5d8"/>
      <rect class="cell" y="48" width="48" height="48" fill="#91d5d8"/><rect class="cell" x="48" y="48" width="48" height="48" fill="#91d5d8"/><rect class="cell" x="96" y="48" width="48" height="48" fill="#91d5d8"/>
      <rect class="cell" y="96" width="48" height="48" fill="#91d5d8"/><rect class="cell" x="48" y="96" width="48" height="48" fill="#91d5d8"/><rect class="cell" x="96" y="96" width="48" height="48" fill="#91d5d8"/>
    </g>
    <text class="small" x="192" y="59">after specialization</text>
    <g transform="translate(184 72)">
      <rect class="cell" width="40" height="40" fill="#087e8b"/><rect class="cell" x="40" width="40" height="40" fill="#dbeafe"/><rect class="cell" x="80" width="40" height="40" fill="#dbeafe"/>
      <rect class="cell" y="40" width="40" height="40" fill="#dbeafe"/><rect class="cell" x="40" y="40" width="40" height="40" fill="#087e8b"/><rect class="cell" x="80" y="40" width="40" height="40" fill="#dbeafe"/>
      <rect class="cell" y="80" width="40" height="40" fill="#dbeafe"/><rect class="cell" x="40" y="80" width="40" height="40" fill="#dbeafe"/><rect class="cell" x="80" y="80" width="40" height="40" fill="#087e8b"/>
    </g>
    <path d="M166 139 L178 139" stroke="#c2413b" stroke-width="2.5"/>
    <path d="M174 134 L180 139 L174 144" fill="none" stroke="#c2413b" stroke-width="2.5"/>
    <text class="label" x="24" y="250">Rᵢₙ ≈ r</text><text class="small" x="24" y="271">all hidden units equivalent</text>
    <text class="label" x="184" y="250">Rᵢₙ ≈ δᵢₙ</text><text class="small" x="184" y="271">unit-teacher matching</text>
  </g>
  <text class="small" x="40" y="432">The plateau ends when permutation symmetry among student hidden units becomes unstable.</text>
</svg>
